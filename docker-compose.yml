# Chestnut Console: Home Assistant + the ESPHome tools.
# The same file runs on the dev PC now and on the Ubuntu server VM at the house later.
# Run from the repo root. Each line is one service, started with one command:
#
#   docker compose up -d homeassistant      Home Assistant, http://<host>:8123 (stays running)
#   docker compose run --rm esphome run tab5-thermostat.yaml --device <tab5-ip>
#                                           build the Tab5 firmware and install it over Wi-Fi
#   docker compose run --rm esphome-host run main-thermostat-sim.yaml
#                                           the host sim (thermostat + virtual house), API on 6053
#   docker compose up -d esphome            optional: the ESPHome Device Builder, http://<host>:6052
#
# Plain `docker compose up -d` starts Home Assistant only: every other service is in a profile,
# and naming a service on the command line starts it without passing --profile.

name: chestnut-console

services:
  homeassistant:
    image: homeassistant/home-assistant:2026.10.4
    container_name: homeassistant
    # Host networking lets HA discover and talk to devices on the LAN directly.
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: America/New_York
    volumes:
      - ./home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro

  # ESPHome for the Tab5: one-off CLI runs (compile, run, logs) and, when started with `up`, the
  # Device Builder web UI. Nothing depends on the web UI (HA talks to the Tab5 directly), so it
  # no longer starts with Home Assistant.
  esphome:
    image: esphome/esphome:2026.10.1
    container_name: esphome
    profiles: [esphome]
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: America/New_York
      ESPHOME_DASHBOARD_USE_PING: "true"
    volumes:
      - ./tab5-thermostat:/config
      # Toolchain and build cache, so rebuilding the container doesn't re-download gigabytes.
      - esphome-cache:/cache

  # Dev only: ESPHome host builds (milestone 2's play sim for HA, and its tests). ESPHome
  # 2026.10.1's precompiled header breaks host builds that have a datetime entity, so it's off
  # here. The esphome service keeps it: Tab5 (ESP-IDF) builds are faster with it.
  #   docker compose run --rm esphome-host run main-thermostat-sim.yaml
  esphome-host:
    image: esphome/esphome:2026.10.1
    profiles: [dev]
    network_mode: host
    environment:
      TZ: America/New_York
      ESPHOME_PCH_ENABLE: "0"
    volumes:
      - ./tab5-thermostat:/config
      - esphome-cache:/cache

  # Dev only: desktop preview of the console (ESPHome host + SDL under Xvfb).
  #   docker compose run --rm preview <yaml> <outdir> [scenario ...]
  preview:
    build: tools/preview
    image: chestnut-preview
    profiles: [dev]
    volumes:
      - ./tab5-thermostat:/config
      - ./tools/preview:/tools:ro
      - esphome-cache:/cache
    entrypoint: ["/tools/shoot.sh"]

volumes:
  esphome-cache:
