# Original Tab5 revision (made before Oct 14 2025): ILI9881C display + separate GT911 touch.

display:
  - platform: mipi_dsi
    id: tab5_display
    model: M5STACK-TAB5
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  - platform: gt911
    id: touch
    interrupt_pin: GPIO23
    update_interval: never
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
