# Newer Tab5 revision: ST7123 integrated display + touch controller (touch at I2C 0x55).

display:
  - platform: mipi_dsi
    id: tab5_display
    model: M5STACK-TAB5-ST7123
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  - platform: st7123
    id: touch
    interrupt_pin: GPIO23
    # No reset_pin on purpose: the LCD reset also enables the touch engine, and toggling
    # the separate touch reset line can take the touch controller offline on the Tab5.
