# Desktop preview of the Main Thermostat console (dev only).
# ESPHome host platform + an SDL window, run under Xvfb by tools/preview/shoot.sh.
# Provides the same ids the Tab5 hardware packages do (tab5_display, touch, sntp_time, backlight),
# so the ui/ packages compile unchanged.

substitutions:
  display_rotation: 0°
  # Fast history sampling so screenshots show a line.
  hist_sample_interval: 1s
  hist_sample_seconds: "1"

esphome:
  name: console-preview

packages:
  contract: !include ../ui/dev/contract-stub.yaml
  fonts: !include ../ui/fonts.yaml
  theme: !include ../ui/theme.yaml
  console: !include ../ui/console.yaml
  console_logic: !include ../ui/console-logic.yaml

host:

api:

logger:

time:
  - platform: host
    id: sntp_time
    timezone: America/New_York

display:
  - platform: sdl
    id: tab5_display
    dimensions:
      width: 1280
      height: 720
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: sdl
    id: touch

output:
  - platform: template
    id: backlight_out
    type: float
    write_action:
      - logger.log:
          format: "backlight=%.2f"
          args: ["state"]

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_out
    default_transition_length: 0s


# Test-only: what the console's labels and pills say right now, as JSON (read by drive.py).
text_sensor:
  - platform: template
    id: ui_snapshot
    name: "UI Snapshot"
    update_interval: 500ms
    lambda: |-
      auto txt = [](lv_obj_t *o) -> std::string { const char *s = lv_label_get_text(o); return s ? s : ""; };
      auto child = [&](lv_obj_t *o) -> std::string { return txt(lv_obj_get_child(o, 0)); };
      auto vis = [](lv_obj_t *o) -> std::string { return lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN) ? "0" : "1"; };
      auto sel = [](lv_obj_t *o) -> std::string { return lv_obj_has_state(o, LV_STATE_CHECKED) ? "1" : "0"; };
      std::string j = "{";
      auto add = [&](const char *k, const std::string &v) {
        std::string e;
        for (char c : v) { if (c == '"' || c == '\\') e += '\\'; e += c; }
        j += "\"" + std::string(k) + "\":\"" + e + "\",";
      };
      add("title", txt(id(lbl_title)));
      add("date", txt(id(lbl_date)));
      add("clock", txt(id(lbl_clock)));
      add("sched", txt(id(lbl_sched)));
      add("resume_visible", vis(id(btn_resume)));
      add("inside", txt(id(lbl_inside)));
      add("room", txt(id(lbl_room)));
      add("status", txt(id(lbl_status)));
      add("sub", txt(id(lbl_sub)));
      add("hist_mid", txt(id(lbl_hist_mid)));
      add("hist_visible", vis(id(obj_hist)));
      add("banner_visible", vis(id(obj_banner)));
      add("banner", txt(id(lbl_banner)));
      add("tgt_label", txt(id(lbl_tgt_label)));
      add("tgt_comfort", txt(id(lbl_tgt_comfort)));
      add("target", lv_obj_has_flag(id(lbl_target), LV_OBJ_FLAG_HIDDEN) ? txt(id(lbl_target_range)) : txt(id(lbl_target)));
      {
        char hex[8];
        snprintf(hex, sizeof(hex), "%06x", (unsigned) (lv_color_to_u32(lv_obj_get_style_bg_color(id(obj_marker), LV_PART_MAIN)) & 0xFFFFFF));
        add("marker", hex);
      }
      add("pm_visible", vis(id(btn_minus)));
      add("out_temp", txt(id(lbl_out_temp)));
      add("out_cond", txt(id(lbl_out_cond)));
      add("hum", txt(id(lbl_hum)));
      add("hum_cap", txt(id(lbl_hum_desc)));
      add("mode_pills", child(id(btn_mode_off)) + "|" + child(id(btn_mode_heat)) + "|" + child(id(btn_mode_cool)) + "|" + child(id(btn_mode_auto)));
      add("mode_sel", sel(id(btn_mode_off)) + sel(id(btn_mode_heat)) + sel(id(btn_mode_cool)) + sel(id(btn_mode_auto)));
      add("fan_pills", child(id(btn_fan_auto)) + "|" + child(id(btn_fan_on)));
      add("fan_sel", sel(id(btn_fan_auto)) + sel(id(btn_fan_on)));
      add("lvl_pills", child(id(btn_lvl_comfort)) + "|" + child(id(btn_lvl_eco)));
      add("lvl_sel", sel(id(btn_lvl_comfort)) + sel(id(btn_lvl_eco)));
      {
        lv_area_t a, b;
        lv_obj_get_coords(id(lbl_date), &a); lv_obj_get_coords(id(lbl_sched), &b);
        add("topbar_gap", std::to_string((int) (b.x1 - a.x2)));
        lv_obj_get_coords(id(lbl_room), &a); lv_obj_get_coords(id(lbl_room_deg), &b);
        add("room_deg_gap", std::to_string((int) (b.x1 - a.x2)));
      }
      {
        auto hexof = [](lv_color_t c) { char h[8]; snprintf(h, sizeof(h), "%06x", (unsigned) (lv_color_to_u32(c) & 0xFFFFFF)); return std::string(h); };
        add("c_page", hexof(lv_obj_get_style_bg_color(id(bg_page), LV_PART_MAIN)));
        add("c_card", hexof(lv_obj_get_style_bg_color(id(card_room), LV_PART_MAIN)));
        add("c_emph", hexof(lv_obj_get_style_bg_color(id(card_target), LV_PART_MAIN)));
        add("c_hum", hexof(lv_obj_get_style_bg_color(id(card_hum), LV_PART_MAIN)));
        add("c_pill", hexof(lv_obj_get_style_bg_color(id(btn_mode_off), LV_PART_MAIN)));
        add("c_pill_sel", hexof(lv_obj_get_style_bg_color(id(btn_lvl_comfort), LV_PART_MAIN)));
        add("c_pill_sel_text", hexof(lv_obj_get_style_text_color(id(btn_lvl_comfort), LV_PART_MAIN)));
        add("c_ink", hexof(lv_obj_get_style_text_color(id(lbl_room), LV_PART_MAIN)));
        add("c_sub", hexof(lv_obj_get_style_text_color(id(lbl_inside), LV_PART_MAIN)));
        add("icon", strcmp(lv_label_get_text(id(lbl_theme_icon)), "\U000F05A8") == 0 ? "sun" : "moon");
      }
      j.back() = '}';
      return j;
