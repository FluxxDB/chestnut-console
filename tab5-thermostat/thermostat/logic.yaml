# Thermostat logic (milestone 2): ESPHome's stock thermostat climate `main_thermostat`, wired to
# the package contract (room_temperature, room_humidity, relay_heat / relay_cool / relay_fan from
# the sim or hardware package), plus the safety timer settings and read-only call sensors.
# This is the only package that turns a relay on. relay_ob (O/B) is never touched.
# The thermostat reads a sanity-checked temperature (checked_temperature_c), never
# room_temperature directly; sensor_fault, call_wait_reason and action_elapsed report on it.
# Runs unchanged on the Tab5 and on the host; test-only hooks live in tests/main-thermostat-test.yaml.

substitutions:
  timer_unit_s: "60"  # seconds per "minute" for every user-facing timer (1 in the tests)
  # Compile-time minimum timers (= the timer numbers' defaults x timer_unit_s). The numbers
  # below set them again at boot from their restored values.
  heat_run_s: "180"
  heat_off_s: "180"
  cool_run_s: "300"
  cool_off_s: "300"
  min_idle_s: "30"

esphome:
  includes:
    # Resolved next to this file. A list, so it merges with the sim package's includes.
    - chestnut_logic.h
  on_boot:
    # Before anything publishes: every room_temperature reading goes through the sanity checker,
    # and the thermostat sees only its verdict (value(), NaN while faulted). A NaN makes the
    # thermostat ask for OFF: no new call starts, and a running call still ends only when its
    # minimum run allows (ESPHome's idle_action_ready_). The 1 s interval below catches the
    # faults that come with no reading (stale, frozen) and the recovery.
    - priority: 800
      then:
        - lambda: |-
            // Production thresholds with every time scaled by timer_unit_s: stale 2 min,
            // frozen 30 min, recover after 5 min of good readings; 2-40 °C; a jump over 2 °C
            // held back for one reading.
            static chestnut::SanityChecker checker(chestnut::SanityConfig{
                2000u * ${timer_unit_s}, 30000u * ${timer_unit_s}, 5000u * ${timer_unit_s},
                2.0f, 40.0f, 2.0f});
            id(g_sanity) = &checker;
            id(g_boot_ms) = millis();  // millis() isn't uptime on the host (monotonic clock)
            id(room_temperature).add_on_state_callback([](float c) {
              checker.on_reading(millis(), c);
              id(checked_temperature_c).publish_state(checker.value());
            });

globals:
  # Interlock fault latch (spec, Safety 3). Not restored: a reboot clears it, and relays boot off.
  # Also read by call_wait_reason.
  - id: g_interlock_latched
    type: bool
    restore_value: false
    initial_value: "false"
  # millis() of the latest trip; the Clear button waits the minimum off time from here.
  - id: g_interlock_trip_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # The sensor sanity checker (spec, Safety 4), a chestnut::SanityChecker created and fed in
  # on_boot above. A void pointer because ESPHome declares globals before it includes
  # chestnut_logic.h, so a global can't have the checker's type; lambdas cast it back.
  - id: g_sanity
    type: void *
    restore_value: false
    initial_value: nullptr
  # millis() at boot, for call_wait_reason's "Starting up".
  - id: g_boot_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # action_elapsed: the last climate action seen by on_state (255 = none yet), whole seconds
  # counted since it began, and the millis() those seconds run up to. Counted in steps of under
  # 30 s, so an action longer than millis()'s 49.7-day wrap (Off all summer) still adds up.
  - id: g_last_action
    type: uint8_t
    restore_value: false
    initial_value: "255"
  - id: g_action_elapsed_s
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_action_mark_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Auto changeover lockout in seconds (changeover_lockout x timer_unit_s), for Task 9.
  - id: g_changeover_lockout_s
    type: uint32_t
    initial_value: "30 * ${timer_unit_s}"

sensor:
  # What the thermostat acts on (°C). NaN means "no usable reading".
  - platform: template
    id: checked_temperature_c
    internal: true
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: never
    on_value:
      - lambda: id(checked_temperature).publish_state(chestnut::c_to_f(x));
  # Contract: the checked room temperature in °F, for the screen and HA.
  - platform: template
    id: checked_temperature
    name: "Checked Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  # Contract: seconds since the current heating / cooling / idle (or off) action began. Published
  # at once (0) on each action change and every 30 s after. Seconds, not a timestamp.
  - platform: template
    id: action_elapsed
    name: "Action Elapsed"
    icon: mdi:timer-sand
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

climate:
  - platform: thermostat
    id: main_thermostat
    name: "Main Thermostat"
    sensor: checked_temperature_c
    humidity_sensor: room_humidity
    # After any boot, heat and cool wait out their minimum off times before the first call.
    startup_delay: true
    min_idle_time: ${min_idle_s}s
    min_heating_run_time: ${heat_run_s}s
    min_heating_off_time: ${heat_off_s}s
    min_cooling_run_time: ${cool_run_s}s
    min_cooling_off_time: ${cool_off_s}s
    # Required with fan mode actions. ESPHome never goes below 1 s for any of its timers.
    min_fan_mode_switching_time: 1s
    # Modes: OFF, HEAT, COOL (from the actions) and HEAT_COOL (our "Auto"). No AUTO, no FAN_ONLY.
    heat_cool_mode: true
    # Covers 48–92°F: the derived companion setpoint can sit just outside 50–90°F.
    visual:
      min_temperature: 8.5
      max_temperature: 33.5
      temperature_step: 0.5
    # First boot (nothing restored yet): Off, fan Auto. Without the fan mode here the thermostat
    # would start in fan mode ON (its fallback for an unset fan mode) and run G at boot.
    default_preset: Default
    # action_elapsed restarts whenever the action changes. on_state fires on every climate
    # publish (each reading), so compare with the last action seen.
    on_state:
      - lambda: |-
          if ((uint8_t) x.action != id(g_last_action)) {
            id(g_last_action) = (uint8_t) x.action;
            id(g_action_elapsed_s) = 0;
            id(g_action_mark_ms) = millis();
            id(action_elapsed).publish_state(0);
          }
    preset:
      - name: Default
        mode: "OFF"
        fan_mode: AUTO
        default_target_temperature_low: 22.2
        default_target_temperature_high: 23.3

    # Equipment calls (spec): heating W only, cooling Y + G, Fan On G in any mode, O/B never.
    # Heat and cool turn the opposite relay off before turning theirs on (interlock layer 2).
    # While the interlock is latched the relays are not turned on (layer 3 guards the actions
    # as well as cutting the relays); turning them off is always allowed.
    heat_action:
      - switch.turn_off: relay_cool
      - if:
          condition:
            lambda: return !id(g_interlock_latched);
          then:
            - switch.turn_on: relay_heat
            - if:
                condition:
                  lambda: return id(main_thermostat).fan_mode == climate::CLIMATE_FAN_ON;
                then:
                  - switch.turn_on: relay_fan
                else:
                  - switch.turn_off: relay_fan  # the furnace runs its own blower
    cool_action:
      - switch.turn_off: relay_heat
      - if:
          condition:
            lambda: return !id(g_interlock_latched);
          then:
            - switch.turn_on: relay_cool
            - switch.turn_on: relay_fan  # the air handler needs G for the blower
    idle_action:
      - switch.turn_off: relay_heat
      - switch.turn_off: relay_cool
      - if:
          condition:
            lambda: return id(main_thermostat).fan_mode == climate::CLIMATE_FAN_ON;
          then:
            - switch.turn_on: relay_fan
          else:
            - switch.turn_off: relay_fan
    fan_mode_on_action:
      - switch.turn_on: relay_fan
    fan_mode_auto_action:
      # A running AC keeps its blower; otherwise G is off.
      - if:
          condition:
            lambda: return id(main_thermostat).action != climate::CLIMATE_ACTION_COOLING;
          then:
            - switch.turn_off: relay_fan

# Read-only W / Y / G state for the screen, HA and history. Polled every loop from the relay
# switches, so they work the same with any relay package.
binary_sensor:
  - platform: template
    id: call_heat
    name: "Call Heat"
    device_class: running
    lambda: return id(relay_heat).state;
  - platform: template
    id: call_cool
    name: "Call Cool"
    device_class: running
    lambda: return id(relay_cool).state;
  - platform: template
    id: call_fan
    name: "Call Fan"
    device_class: running
    lambda: return id(relay_fan).state;
  # Contract: the interlock watchdog tripped (W and Y were both on). Stays on until the Clear
  # button is pressed or the device reboots.
  - platform: template
    id: interlock_fault
    name: "Interlock Fault"
    device_class: problem
    lambda: return id(g_interlock_latched);
  # Contract: the temperature sensor's readings are bad (spec, Safety 4); calls stopped. Clears
  # by itself after 5 minutes of good readings.
  - platform: template
    id: sensor_fault
    name: "Sensor Fault"
    device_class: problem
    lambda: |-
      auto *s = static_cast<chestnut::SanityChecker *>(id(g_sanity));
      return s != nullptr && s->fault();

# Contract: why the room is off target but nothing is running. Set by the 1 s interval below.
text_sensor:
  - platform: template
    id: call_wait_reason
    name: "Call Wait Reason"
    icon: mdi:timer-pause-outline
    update_interval: never

# Interlock layer 3 (spec, Safety 3): an independent watchdog. The actions never turn W and Y
# on together (each turns the other relay off first), so both on means something else switched
# a relay. Cut both at once, ignoring minimum run times, record the trip time and latch. While
# latched it keeps W and Y off on every tick (whatever the action guards do) and drops G unless
# the fan mode is On, so a trip mid-cooling doesn't leave the blower running with fan Auto.
# Written as one lambda so a latched tick that finds nothing to do touches nothing (no log noise).
interval:
  - interval: 100ms
    then:
      - lambda: |-
          const bool w = id(relay_heat).state, y = id(relay_cool).state;
          if (w && y) {
            id(g_interlock_trip_ms) = millis();  // a re-trip while waiting restarts the wait
            id(g_interlock_latched) = true;
            ESP_LOGE("interlock", "W and Y both on: both relays cut, interlock fault latched");
          }
          if (id(g_interlock_latched)) {
            if (id(relay_heat).state) id(relay_heat).turn_off();
            if (id(relay_cool).state) id(relay_cool).turn_off();
            if (id(relay_fan).state && id(main_thermostat).fan_mode != climate::CLIMATE_FAN_ON)
              id(relay_fan).turn_off();
          }

  # Sensor sanity tick: stale and frozen faults (no reading needed) and recovery. The thermostat
  # gets a new checked value only when the verdict changes; readings publish their own.
  - interval: 1s
    then:
      - lambda: |-
          auto *s = static_cast<chestnut::SanityChecker *>(id(g_sanity));
          if (s == nullptr) return;  // on_boot hasn't created it yet
          const bool was = s->fault();
          s->tick(millis());
          if (s->fault() != was) id(checked_temperature_c).publish_state(s->value());
      # call_wait_reason, first match wins. The two faults show whenever they're on (a running
      # call may still be finishing its minimum run under a sensor fault). The waits show only
      # when the room is off target (the thermostat wants heat or cool, timers aside) and
      # nothing is running. "Nothing is running" comes from the relays (W / Y), never from
      # main_thermostat's action, which can read HEATING while the interlock latch holds the
      # relays off. Published only when it changes.
      - lambda: |-
          static bool started_up = false;  // latched, so millis() wrapping never re-enters it
          if (!started_up) {
            const uint32_t delay_ms =
                (uint32_t) lroundf(fmaxf(id(heat_min_off).state, id(cool_min_off).state) *
                                   ${timer_unit_s}) * 1000u;
            started_up = millis() - id(g_boot_ms) >= delay_ms;
          }
          const auto *sanity = static_cast<chestnut::SanityChecker *>(id(g_sanity));
          const bool running = id(call_heat).state || id(call_cool).state;
          // What the thermostat would do now if no timer held it (OFF on a NaN reading).
          const auto wanted = id(main_thermostat)->delayed_climate_action();
          const bool off_target = wanted == climate::CLIMATE_ACTION_HEATING ||
                                  wanted == climate::CLIMATE_ACTION_COOLING;
          const bool waiting = off_target && !running;
          const char *reason = "";
          if (id(g_interlock_latched)) {
            reason = "Interlock fault";
          } else if (sanity != nullptr && sanity->fault()) {
            reason = "Sensor fault";
          } else if (waiting && !started_up) {
            reason = "Starting up";  // the boot-time minimum off timers
          // 4. "Changeover wait" (Task 9) goes here, before short-cycle: nothing running, the
          //    Auto changeover lockout active and the room past the other side's threshold.
          } else if (waiting) {
            reason = "Short-cycle protection";  // a minimum off / idle timer holds the call
          }
          auto *t = id(call_wait_reason);
          if (!t->has_state() || t->state != reason) t->publish_state(reason);

  # action_elapsed between action changes.
  - interval: 30s
    then:
      - lambda: |-
          if (id(g_last_action) == 255) return;
          const uint32_t whole_s = (millis() - id(g_action_mark_ms)) / 1000u;
          id(g_action_elapsed_s) += whole_s;
          id(g_action_mark_ms) += whole_s * 1000u;
          id(action_elapsed).publish_state(id(g_action_elapsed_s));

script:
  # Clear button. Never changes the climate mode. The latch (and interlock_fault) stays on until
  # the larger of the two minimum off times has passed since the trip: either relay may have been
  # the forced one, and a compressor must not restart early. Then the latch drops. The
  # thermostat still believes it is HEATING or COOLING if it wanted a call while latched (its
  # actions were guarded, or the watchdog cut the relays behind its back) and would never run its
  # action again, because refresh() does nothing when the computed action is unchanged. So reset
  # that belief to IDLE and refresh: it re-evaluates and runs the right action (or, if a minimum
  # run timer is still counting, when that timer ends).
  - id: clear_interlock
    mode: single
    then:
      - if:
          condition:
            lambda: return id(g_interlock_latched);
          then:
            - wait_until:
                condition:
                  lambda: |-
                    const uint32_t wait_ms =
                        (uint32_t) lroundf(fmaxf(id(heat_min_off).state, id(cool_min_off).state) *
                                           ${timer_unit_s}) * 1000u;
                    return (uint32_t) (millis() - id(g_interlock_trip_ms)) >= wait_ms;
            - lambda: |-
                id(g_interlock_latched) = false;
                auto *t = id(main_thermostat);
                if ((t->action == climate::CLIMATE_ACTION_HEATING && !id(relay_heat).state) ||
                    (t->action == climate::CLIMATE_ACTION_COOLING && !id(relay_cool).state)) {
                  t->action = climate::CLIMATE_ACTION_IDLE;
                  t->refresh();
                }

button:
  - platform: template
    id: clear_interlock_fault
    name: "Clear Interlock Fault"
    icon: mdi:alert-remove-outline
    on_press:
      - script.execute: clear_interlock

# Safety timers in minutes (spec, Safety 2). Restored; a value outside the range is refused.
# Applied at boot (numbers set up before the climate, so the startup delay already uses the
# restored values) and on every change (ESPHome stretches or ends a running timer to match).
number:
  - platform: template
    id: heat_min_run
    name: "Heat Min Run"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "min"
    min_value: 2
    max_value: 20
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(main_thermostat).set_heating_minimum_run_time_in_sec(lroundf(x * ${timer_unit_s}));
  - platform: template
    id: heat_min_off
    name: "Heat Min Off"
    icon: mdi:timer-off-outline
    entity_category: config
    unit_of_measurement: "min"
    min_value: 2
    max_value: 20
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(main_thermostat).set_heating_minimum_off_time_in_sec(lroundf(x * ${timer_unit_s}));
  - platform: template
    id: cool_min_run
    name: "Cool Min Run"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "min"
    min_value: 3
    max_value: 20
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(main_thermostat).set_cooling_minimum_run_time_in_sec(lroundf(x * ${timer_unit_s}));
  - platform: template
    id: cool_min_off
    name: "Cool Min Off"
    icon: mdi:timer-off-outline
    entity_category: config
    unit_of_measurement: "min"
    min_value: 5
    max_value: 20
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(main_thermostat).set_cooling_minimum_off_time_in_sec(lroundf(x * ${timer_unit_s}));
  - platform: template
    id: changeover_lockout
    name: "Changeover Lockout"
    icon: mdi:swap-horizontal
    entity_category: config
    unit_of_measurement: "min"
    min_value: 10
    max_value: 120
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(g_changeover_lockout_s) = lroundf(x * ${timer_unit_s});
