# Host build for the scenario tests (tests/run.sh scenarios): the thermostat packages with
# short timers, fast physics and test-only hooks. Never flashed; the hooks live only here.

substitutions:
  # Physics 600x real time (one 1 s step = 10 simulated minutes), readings every 250 ms.
  sim_speed: "600"
  sim_publish_interval: 250ms
  # Timers: one "minute" = 1 s, so the defaults are 3 / 3 / 5 / 5 s and min_idle_time 1 s.
  timer_unit_s: "1"
  heat_run_s: "3"
  heat_off_s: "3"
  cool_run_s: "5"
  cool_off_s: "5"
  min_idle_s: "1"
  # The schedule reads host_time once at boot; after that test_clock drives it (the 24 h tick
  # never comes during a test).
  clock_id: host_time
  schedule_tick: 24h

esphome:
  name: main-thermostat-test

packages:
  sim: !include ../sim/virtual-house.yaml
  logic: !include ../thermostat/logic.yaml

host:

logger:

api:
  port: 6053
  actions:
    # Test-only: drive the relays directly, bypassing the logic (e.g. both on, for the
    # interlock watchdog). There is deliberately no O/B argument.
    - action: test_force_relays
      variables:
        heat: bool
        cool: bool
      then:
        - lambda: |-
            if (heat) id(relay_heat).turn_on(); else id(relay_heat).turn_off();
            if (cool) id(relay_cool).turn_on(); else id(relay_cool).turn_off();
    # Test-only: hold every room_temperature reading for `ms` before the logic sees it, so the
    # thermostat's decisions run well after their dispatch began (as a slow ESP32 dispatch
    # would). 0 = off.
    - action: test_set_latency
      variables:
        ms: int
      then:
        - lambda: id(g_test_latency_ms) = ms;
    # Test-only: evaluate the schedule at this clock (dow 0=Mon..6=Sun, minute of day), or as
    # if the clock weren't set (valid false).
    - action: test_clock
      variables:
        dow: int
        minute: int
        valid: bool
      then:
        - lambda: id(schedule_evaluate).execute(valid, dow, minute);

globals:
  - id: g_test_latency_ms
    type: int
    restore_value: false
    initial_value: "0"

sensor:
  # Runs before the logic's own room_temperature callback (registered later, in on_boot).
  - id: !extend room_temperature
    on_value:
      - lambda: if (id(g_test_latency_ms) > 0) delay(id(g_test_latency_ms));

time:
  - platform: host
    id: host_time
    timezone: America/New_York
