# Milestone 1 screen: proves display, touch, Wi-Fi and backlight control all work.

lvgl:
  displays:
    - tab5_display
  touchscreens:
    - touch
  pages:
    - id: hello_page
      bg_color: 0x1E1611
      widgets:
        - label:
            align: TOP_MID
            y: 120
            text: "Chestnut Console"
            text_font: montserrat_48
            text_color: 0xF3E7D9
        - label:
            align: TOP_MID
            y: 190
            text: "Middle floor thermostat"
            text_font: montserrat_28
            text_color: 0xB89A80
        - label:
            id: temp_label
            align: CENTER
            y: -120
            text: "--°F"
            text_font: montserrat_48
            text_color: 0xF3E7D9
        - button:
            id: touch_test_button
            align: CENTER
            y: 80
            width: 420
            height: 120
            bg_color: 0x8B4A2B
            radius: 24
            widgets:
              - label:
                  id: touch_test_label
                  align: CENTER
                  text: "Tap to test touch"
                  text_font: montserrat_28
                  text_color: 0xF3E7D9
            on_click:
              - lambda: 'id(tap_count) += 1;'
              - lvgl.label.update:
                  id: touch_test_label
                  text:
                    format: "Touch works: %d taps"
                    args: ["id(tap_count)"]
        - label:
            align: CENTER
            y: 260
            text: "Brightness"
            text_font: montserrat_28
            text_color: 0xB89A80
        - slider:
            id: brightness_slider
            align: CENTER
            y: 330
            width: 520
            height: 40
            min_value: 10
            max_value: 100
            value: 100
            on_release:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0f;'
        - label:
            id: ip_label
            align: BOTTOM_MID
            y: -80
            text: "Connecting to Wi-Fi..."
            text_font: montserrat_28
            text_color: 0xB89A80

globals:
  - id: tap_count
    type: int
    initial_value: "0"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      on_value:
        - lvgl.label.update:
            id: ip_label
            text:
              format: "IP %s"
              args: ["x.c_str()"]
