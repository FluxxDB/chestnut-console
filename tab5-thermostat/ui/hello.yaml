# Milestone 1 screen: proves display, touch, Wi-Fi and backlight control all work.
# Laid out for landscape (1280x720).

lvgl:
  # Panel is natively portrait; the Tab5 sits landscape. Set in tab5-thermostat.yaml.
  rotation: ${display_rotation}
  displays:
    - tab5_display
  touchscreens:
    - touch
  pages:
    - id: hello_page
      bg_color: 0x1E1611
      widgets:
        - label:
            align: TOP_MID
            y: 50
            text: "Chestnut Console"
            text_font: montserrat_48
            text_color: 0xF3E7D9
        - label:
            align: TOP_MID
            y: 115
            text: "Main Thermostat"
            text_font: montserrat_28
            text_color: 0xB89A80
        - label:
            id: temp_label
            align: CENTER
            x: -300
            text: "--°F"
            text_font: montserrat_48
            text_color: 0xF3E7D9
        - button:
            id: touch_test_button
            align: CENTER
            x: 300
            y: -60
            width: 420
            height: 120
            bg_color: 0x8B4A2B
            radius: 24
            widgets:
              - label:
                  id: touch_test_label
                  align: CENTER
                  text: "Tap to test touch"
                  text_font: montserrat_28
                  text_color: 0xF3E7D9
            on_click:
              - lambda: 'id(tap_count) += 1;'
              - lvgl.label.update:
                  id: touch_test_label
                  text:
                    format: "Touch works: %d taps"
                    args: ["id(tap_count)"]
        - label:
            align: CENTER
            x: 300
            y: 70
            text: "Brightness"
            text_font: montserrat_28
            text_color: 0xB89A80
        - slider:
            id: brightness_slider
            align: CENTER
            x: 300
            y: 130
            width: 460
            height: 40
            min_value: 10
            max_value: 100
            value: 100
            # Live while dragging, with no fade, so the screen follows your finger.
            on_value:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0f;'
                  transition_length: 0s
        - label:
            id: ip_label
            align: BOTTOM_MID
            y: -40
            text: "Connecting to Wi-Fi..."
            text_font: montserrat_28
            text_color: 0xB89A80

wifi:
  on_disconnect:
    - lvgl.label.update:
        id: ip_label
        text: "Wi-Fi disconnected"

globals:
  - id: tap_count
    type: int
    initial_value: "0"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      on_value:
        - lvgl.label.update:
            id: ip_label
            text:
              format: "IP %s"
              args: ["x.c_str()"]
