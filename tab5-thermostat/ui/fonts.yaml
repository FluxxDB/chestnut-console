# Console fonts (UI spec: Inter for everything, Space Grotesk 500 for the title only).
# Big sizes carry only the glyphs they show, to save flash. bpp 4 = anti-aliased glyphs:
# ESPHome's default (1 bit) broke up thin strokes on the Tab5 (Dang, on the wall).

substitutions:
  mdi_font_url: "https://github.com/Pictogrammers/pictogrammers.github.io/raw/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf"

font:
  - file: "gfonts://Space Grotesk@500"
    id: f_title
    size: 40
    bpp: 4
    glyphs: "Main Thermost"
  - file: "gfonts://Inter@400"
    id: f_label
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°·–—"
  - file: "gfonts://Inter@400"
    id: f_small
    size: 27
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°·–—"
  - file: "gfonts://Inter@400"
    id: f_pill
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
  - file: "gfonts://Inter@400"
    id: f_mid
    size: 56
    bpp: 4
    glyphs: "0123456789°%—–-+−"
  - file: "gfonts://Inter@400"
    id: f_target
    size: 112
    bpp: 4
    glyphs: "0123456789°—–-Of"
  - file: "gfonts://Inter@400"
    id: f_range
    size: 78
    bpp: 4
    glyphs: "0123456789°—–-"
  - file: "gfonts://Inter@400"
    id: f_room
    size: 172
    bpp: 4
    glyphs: "0123456789—-"
  - file: "gfonts://Inter@400"
    id: f_deg
    size: 104
    bpp: 4
    glyphs: "°"
  # Material Design Icons: the theme button's moon and sun, the humidity drop, and the Outside
  # card's weather (every icon in weather/weather.h's ALL_ICONS; the preview tests check).
  - file:
      type: web
      url: ${mdi_font_url}
    id: f_icon
    size: 34
    bpp: 4
    glyphs:
      - "\U000F0594"  # weather-night (also the theme button's moon)
      - "\U000F05A8"  # white-balance-sunny (the theme button's sun)
      - "\U000F058C"  # water (humidity)
      - "\U000F0599"  # weather-sunny
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0F31"  # weather-night-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0591"  # weather-fog
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F067F"  # weather-snowy-rainy
      - "\U000F0598"  # weather-snowy
      - "\U000F0F36"  # weather-snowy-heavy
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F0592"  # weather-hail
