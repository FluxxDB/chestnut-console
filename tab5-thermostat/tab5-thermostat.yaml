# Chestnut Console: the Main Thermostat, on an M5Stack Tab5.
# Wi-Fi, Home Assistant API, local web page, the console screen, and (milestone 2) the
# thermostat logic running against the virtual house until the bench relays arrive (M4).

substitutions:
  name: tab5-thermostat
  friendly_name: Main Thermostat
  # Landscape. Use 90° instead if the screen comes out upside down.
  display_rotation: 270°
  # Sunset/sunrise theme switching (house location stays in secrets.yaml, not git).
  house_latitude: !secret house_latitude
  house_longitude: !secret house_longitude
  # The schedule's and the virtual house's clock: SNTP, seeded from the RTC at boot.
  clock_id: sntp_time

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

packages:
  board: !include hardware/tab5-base.yaml
  # Use the line matching the driver IC printed on the sticker on the back of the Tab5
  # (just above the Espressif logo). Exactly one must be active.
  # display: !include hardware/display-ili9881c.yaml
  display: !include hardware/display-st7123.yaml
  # display: !include hardware/display-st7121.yaml
  ui_fonts: !include ui/fonts.yaml
  ui_theme: !include ui/theme.yaml
  ui_console: !include ui/console.yaml
  ui_logic: !include ui/console-logic.yaml
  # Milestone 2: the thermostat logic, against the virtual house (the sim package stands in
  # for the ENV IV sensor and the Unit 4-Relay until M4; its knobs are on the web page).
  logic: !include thermostat/logic.yaml
  sim: !include sim/virtual-house.yaml

wifi:
  # The Tab5's radio is 2.4 GHz only.
  # Never reboot because Wi-Fi is down: a reboot drops the relays (the default is 15 min).
  reboot_timeout: 0s
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the Tab5 opens its own hotspot for setup.
  ap:
    ssid: "Tab5 Thermostat Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  # Never reboot because Home Assistant is unreachable (the default is 15 min).
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  # The empty encryption block makes OTA reuse the API key above. Without it, OTA has no auth.
  - platform: esphome
    encryption: {}

# Phone-friendly control page served by the Tab5 itself: http://<tab5-ip>/
web_server:
  port: 80
  version: 3
  local: true
  ota: false
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
