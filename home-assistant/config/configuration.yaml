# Home Assistant config for Chestnut Console.
# Users, integrations and devices are set up in the UI and live in .storage/ (not committed).

default_config:

frontend:
  # The Axiom theme (themes/axiom.yaml), made the default for everyone by the
  # "Chestnut: Axiom theme" automation at startup.
  themes: !include_dir_merge_named themes
  # Loads the self-hosted JetBrains Mono on every HA page (the theme's font), not only on
  # the dashboard.
  extra_module_url:
    - /local/chestnut/style.js

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/chestnut/chestnut-dashboard.js
      type: module
  dashboards:
    # Takes the place of HA's Overview (url /lovelace).
    lovelace:
      mode: yaml
      filename: dashboards/chestnut.yaml
      title: Chestnut
      icon: mdi:thermostat
      show_in_sidebar: true

# The System tab's ALERTS switches: whether each phone alert is sent (the automations read them).
input_boolean:
  chestnut_alert_sensor_fault:
    name: "Alert: sensor fault"
    icon: mdi:thermometer-alert
    initial: true
  chestnut_alert_interlock_fault:
    name: "Alert: interlock fault"
    icon: mdi:shield-alert
    initial: true
  chestnut_alert_offline:
    name: "Alert: thermostat offline 10 min"
    icon: mdi:lan-disconnect
    initial: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
